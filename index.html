        anchors: { en: ['Fully private', 'Easily seen'], hi: ['पूरी तरह निजी', 'आसानी से दिखते थे'], mr: ['पूर्णपणे खाजगी', 'सहज दिसत होती'] } },

/**
 * Facilitator Session Note: shared logic (validation, personal-data check, review flags, comparison).
 * Pure functions, no I/O. Runs in Apps Script (copy as FnCore.gs), the browser and Node tests.
 */
var FNCore = (function () {
  var REVIEW_FLAGGED_SHARE = 0.10; // decided 2 Oct
  var COMPARE_GAP = 2;             // decided 2 Oct
  var LIMIT_DESIRABILITY = 4;

  function isTime(s) { return typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s); }
  function minutes(s) { var p = s.split(':'); return Number(p[0]) * 60 + Number(p[1]); }
  function codes(f) { return (f.options || []).map(function (x) { return x.v; }); }
  function shown(f, note) { return !f.showIf || note[f.showIf.field] === f.showIf.equals; }
  function required(f, note) {
    if (f.requiredIf) return note[f.requiredIf.field] === f.requiredIf.equals;
    return !!f.required;
  }
  function empty(v) { return v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0); }

  /** Personal-data check for free text. Returns a list of reasons; empty list = clean. */
  function piiCheck(text) {
    var reasons = [];
    if (!text) return reasons;
    var t = String(text);
    if (/[\w.+-]+@[\w-]+\.[\w.]+/.test(t)) reasons.push('email');
    if (/(\+?91[\s-]?)?[6-9]\d{4}[\s-]?\d{5}/.test(t)) reasons.push('phone');
    if (/\b\d{4}[\s-]?\d{4}[\s-]?\d{4}\b/.test(t)) reasons.push('id_number');
    if (/\d{7,}/.test(t.replace(/[\s-]/g, ''))) reasons.push('long_number');
    if (/\b(Mr|Mrs|Ms|Miss|Dr|Shri|Smt|Kumari|Sir|Madam|Ma'am)\.?\s+[A-Z][a-z]+/.test(t)) reasons.push('titled_name');
    if (/(श्री|श्रीमती|कुमारी|सौ\.)\s*\S+/.test(t)) reasons.push('titled_name');
    if (/\b(name is|named|called)\s+[A-Z][a-z]+/i.test(t)) reasons.push('named_person');
    if (/(नाम|नाव)\s*(है|आहे)?\s*[:\-]?\s*\S+/.test(t)) reasons.push('named_person');
    if (/\b(roll\s*(no|number)|class\s*\d+\s*[A-Z]\b|section\s+[A-Z]\b)/i.test(t)) reasons.push('class_detail');
    return reasons.filter(function (r, i, a) { return a.indexOf(r) === i; });
  }

  /** Validate a note against the schema. Returns { ok, errors: [{field, code}] }. */
  function validate(note, schema) {
    var errors = [];
    function err(field, code) { errors.push({ field: field, code: code }); }
    schema.fields.forEach(function (f) {
      var v = note[f.id];
      if (!shown(f, note)) { if (!empty(v)) err(f.id, 'not_applicable'); return; }
      if (empty(v)) { if (required(f, note)) err(f.id, 'required'); return; }
      switch (f.type) {
        case 'single':
          if (codes(f).indexOf(v) < 0) err(f.id, 'invalid_option'); break;
        case 'multi':
          if (!Array.isArray(v)) { err(f.id, 'invalid_type'); break; }
          if (v.some(function (x) { return codes(f).indexOf(x) < 0; })) err(f.id, 'invalid_option');
          if (f.exclusive && v.indexOf(f.exclusive) >= 0 && v.length > 1) err(f.id, 'exclusive_conflict');
          break;
        case 'scale':
          if (typeof v !== 'number' || v % 1 !== 0 || v < f.scale.min || v > f.scale.max) err(f.id, 'out_of_range'); break;
        case 'int':
          if (typeof v !== 'number' || v % 1 !== 0 || v < f.min || v > f.max) err(f.id, 'out_of_range'); break;
        case 'time':
          if (!isTime(v)) err(f.id, 'invalid_time'); break;
        case 'itemlist':
          if (!Array.isArray(v) || v.some(function (x) { return typeof x !== 'number' || x % 1 !== 0 || x < f.min || x > f.max; })) err(f.id, 'invalid_items');
          break;
        case 'text':
          if (typeof v !== 'string') { err(f.id, 'invalid_type'); break; }
          if (v.length > schema.textMax) err(f.id, 'too_long');
          if (piiCheck(v).length) err(f.id, 'personal_data');
          break;
      }
    });
    if (typeof note.forms_flagged === 'number' && typeof note.forms_collected === 'number' && note.forms_flagged > note.forms_collected) err('forms_flagged', 'more_than_collected');
    if (isTime(note.session_start) && isTime(note.session_end) && minutes(note.session_end) <= minutes(note.session_start)) err('session_end', 'end_before_start');
    var known = schema.fields.map(function (f) { return f.id; });
    Object.keys(note).forEach(function (k) { if (known.indexOf(k) < 0) err(k, 'unknown_field'); });
    return { ok: errors.length === 0, errors: errors };
  }

  function sessionMinutes(note) {
    if (!isTime(note.session_start) || !isTime(note.session_end)) return null;
    return minutes(note.session_end) - minutes(note.session_start);
  }

  /** Review and limitations flags (rules in the doc, decided 2 Oct). */
  function flags(note) {
    var review = [], limits = [];
    if (note.data_confidence === 'low') review.push('low_confidence');
    if (note.forms_collected > 0 && note.forms_flagged / note.forms_collected > REVIEW_FLAGGED_SHARE) review.push('flagged_forms_over_10pct');
    if (note.hostility === 'strong') review.push('strong_hostility');
    if (note.desirability_score >= LIMIT_DESIRABILITY) limits.push('social_desirability');
    if (note.authority_influence === 'clearly') limits.push('authority_influence');
    var op = note.others_present || [];
    if (op.indexOf('principal') >= 0 || op.indexOf('teacher') >= 0) limits.push('authority_present');
    return { review: review, limitations: limits };
  }

  /** Compare notes from different facilitators on one session: 1-5 scales differing by >= 2. */
  function compare(notes, schema) {
    var scales = schema.fields.filter(function (f) { return f.type === 'scale'; }).map(function (f) { return f.id; });
    var gaps = [];
    if (!notes || notes.length < 2) return gaps;
    scales.forEach(function (id) {
      var vals = notes.map(function (n) { return n[id]; }).filter(function (v) { return typeof v === 'number'; });
      if (vals.length < 2) return;
      var gap = Math.max.apply(null, vals) - Math.min.apply(null, vals);
      if (gap >= COMPARE_GAP) gaps.push({ field: id, gap: gap, values: vals });
    });
    return gaps;
  }

  /** Flat row for the sheet: fixed column order from the schema. */
  function columns(schema) {
    var cols = ['note_id', 'schema_version', 'submitted_at', 'session_key', 'institute_code', 'session_date', 'template_id', 'facilitator_code'];
    schema.fields.forEach(function (f) { cols.push(f.id); });
    return cols.concat(['session_minutes', 'review_flags', 'limitation_flags']);
  }
  function toRow(record, schema) {
    return columns(schema).map(function (c) {
      var v = record[c];
      if (Array.isArray(v)) return v.join(',');
      return v === undefined || v === null ? '' : v;
    });
  }

  return { piiCheck: piiCheck, validate: validate, sessionMinutes: sessionMinutes, flags: flags, compare: compare,
           columns: columns, toRow: toRow, REVIEW_FLAGGED_SHARE: REVIEW_FLAGGED_SHARE, COMPARE_GAP: COMPARE_GAP };
})();
if (typeof module !== 'undefined') { module.exports = FNCore; }

/**
 * School coverage check (field direction 5): pure logic, no I/O.
 * Runs in Apps Script (copy as CovCore.gs), the browser and Node tests.
 *
 * Input rows are scanned survey responses for ONE school, already mapped to:
 *   { session_key, session_date, group: 'parents'|'teachers'|'staff'|'students'|'other',
 *     gender: 'male'|'female'|'other'|'', grade: '<grade code or empty>', score: <0-100 overall protection score or null> }
 * No identifying data: one row per scanned form, as Bodh already stores it.
 */
var COV_CONFIG = {
  targets: { parents: 30, fathers: 5, teachers: 10, grades: 3 }, // soft targets, decided 2 Oct
  cutoffs: [40, 65, 85],          // band lines: HIGH <40, MODERATE 40-<65, LOW 65-<85, PROTECTED >=85
  cutZone: 7,                     // a score within 7 points of a band line triggers a second session
  maxSessions: 2,
  secondSessionDays: 14,          // Prajakta schedules within 2 weeks of the first session
  minDisplay: 5,                  // never show a score from fewer than 5 forms
  scoreGroups: ['parents', 'teachers', 'staff'], // whose forms make up the school's decision score
  teacherGroups: ['teachers', 'staff']
};

var CovCore = (function () {
  function band(score, cut) {
    if (score === null || score === undefined || isNaN(score)) return null;
    if (score < cut[0]) return 'HIGH';
    if (score < cut[1]) return 'MODERATE';
    if (score < cut[2]) return 'LOW';
    return 'PROTECTED';
  }
  function mean(a) { return a.reduce(function (s, x) { return s + x; }, 0) / a.length; }
  function sd(a) {
    if (a.length < 2) return null;
    var m = mean(a);
    return Math.sqrt(a.reduce(function (s, x) { return s + (x - m) * (x - m); }, 0) / (a.length - 1));
  }
  function round1(x) { return x === null ? null : Math.round(x * 10) / 10; }
  function addDays(iso, n) {
    var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  /**
   * profile (optional): { teachers_available: <number> } from the school profile tab.
   * Returns the coverage record for one school.
   */
  function assess(instituteCode, rows, profile, cfg) {
    cfg = cfg || COV_CONFIG;
    profile = profile || {};
    var t = cfg.targets;
    var parents = rows.filter(function (r) { return r.group === 'parents'; });
    var teachers = rows.filter(function (r) { return cfg.teacherGroups.indexOf(r.group) >= 0; });
    var fathers = parents.filter(function (r) { return r.gender === 'male'; });
    var grades = {};
    parents.forEach(function (r) { if (r.grade) grades[r.grade] = true; });
    var sessions = {};
    rows.forEach(function (r) { sessions[r.session_key] = r.session_date; });
    var sessionKeys = Object.keys(sessions);
    var dates = sessionKeys.map(function (k) { return sessions[k]; }).sort();

    var teacherTarget = typeof profile.teachers_available === 'number' && profile.teachers_available < t.teachers
      ? profile.teachers_available : t.teachers;

    var scores = rows.filter(function (r) { return cfg.scoreGroups.indexOf(r.group) >= 0 && typeof r.score === 'number' && !isNaN(r.score); })
      .map(function (r) { return r.score; });
    var n = scores.length;
    var m = n ? mean(scores) : null;
    var s = sd(scores);
    var half = (s !== null && n > 1) ? 1.96 * s / Math.sqrt(n) : null;
    var nearest = null;
    if (m !== null) cfg.cutoffs.forEach(function (c) { if (nearest === null || Math.abs(m - c) < Math.abs(m - nearest)) nearest = c; });
    var nearCut = m !== null && n >= cfg.minDisplay && Math.abs(m - nearest) <= cfg.cutZone;

    var shortfalls = [];
    if (parents.length < t.parents) shortfalls.push({ item: 'parents', have: parents.length, target: t.parents });
    if (fathers.length < t.fathers) shortfalls.push({ item: 'fathers', have: fathers.length, target: t.fathers });
    if (teachers.length < teacherTarget) shortfalls.push({ item: 'teachers', have: teachers.length, target: teacherTarget });
    if (Object.keys(grades).length < t.grades) shortfalls.push({ item: 'grades', have: Object.keys(grades).length, target: t.grades });

    var reasons = shortfalls.map(function (x) { return x.item + '_short'; });
    if (nearCut) reasons.push('near_band_line_' + nearest);

    var status;
    if (!rows.length) status = 'pending';
    else if (!reasons.length) status = 'ok';
    else if (sessionKeys.length < cfg.maxSessions) status = 'second_session_needed';
    else status = 'low_confidence';

    var showScore = n >= cfg.minDisplay;
    return {
      institute_code: String(instituteCode),
      sessions_held: sessionKeys.length,
      first_session: dates[0] || null,
      second_session_due: status === 'second_session_needed' && dates[0] ? addDays(dates[0], cfg.secondSessionDays) : null,
      counts: { parents: parents.length, fathers: fathers.length, teachers: teachers.length, grades: Object.keys(grades).length, scored_forms: n },
      targets: { parents: t.parents, fathers: t.fathers, teachers: teacherTarget, grades: t.grades },
      shortfalls: shortfalls,
      score: showScore ? round1(m) : null,
      score_range: showScore && half !== null ? [round1(m - half), round1(m + half)] : null,
      band: showScore ? band(m, cfg.cutoffs) : null,
      near_band_line: showScore && nearCut ? nearest : null,
      status: status,
      reasons: reasons

  }

  /** Map raw scanned rows to the shape assess() needs, using the column map and value maps. */
  function mapRow(raw, map) {
    function pick(k) { var v = raw[map.columns[k]]; return v === undefined || v === null ? '' : String(v).trim(); }
    var g = pick('group'), gender = pick('gender').toLowerCase();
    var score = pick('score');
    return {
      session_key: [pick('institute_code'), pick('session_date'), pick('template_id')].join('|'),
      session_date: pick('session_date'),
      group: map.groupValues[g] || map.groupValues[g.toLowerCase()] || 'other',
      gender: map.maleValues.indexOf(gender) >= 0 ? 'male' : map.femaleValues.indexOf(gender) >= 0 ? 'female' : (gender ? 'other' : ''),
      grade: pick('grade'),
      score: score === '' ? null : Number(score)

  }

  /** Order for Prajakta's list: needs action first, then low confidence, then pending, then ok. */
  function sortForAction(list) {
    var rank = { second_session_needed: 0, low_confidence: 1, pending: 2, ok: 3 };
    return list.slice().sort(function (a, b) {
      return (rank[a.status] - rank[b.status]) || String(a.second_session_due || '9').localeCompare(String(b.second_session_due || '9')) ||
        a.institute_code.localeCompare(b.institute_code);
    });
  }

  return { assess: assess, mapRow: mapRow, band: band, sortForAction: sortForAction };
})();

 * Usage:

 *     send: function (action, body) { ... },   // the app's existing queued API call; must queue offline
 *     fetchSiteMemory: function (instituteCode) { return Promise<{notes:[{date,text}]}> } // optional
 *     onDone: function () { ... }              // optional

var FacilitatorNote = (function () {
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k]; else if (k === 'cls') e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
    });

  }

  function mount(root, opts) {

    var note = {};
    try { note = JSON.parse(localStorage.getItem(draftKey) || '{}'); } catch (e) { note = {}; }
    var noteId = note.__id || uuid(); note.__id = noteId;

    function save() { try { localStorage.setItem(draftKey, JSON.stringify(note)); } catch (e) {} }
    function val(f) { return note[f.id]; }

    root.innerHTML = '';
    var form = el('form', { cls: 'fn-form', novalidate: 'novalidate' });
    form.appendChild(el('h2', { text: S.ui.title[L] }));
    form.appendChild(el('p', { cls: 'fn-warn', text: S.ui.noNames[L] }));

    if (opts.fetchSiteMemory) {
      var mem = el('div', { cls: 'fn-memory' });
      form.appendChild(mem);
      opts.fetchSiteMemory(opts.session.institute_code).then(function (r) {
        if (!r || !r.notes || !r.notes.length) return;
        mem.appendChild(el('h3', { text: S.ui.siteMemory[L] }));
        r.notes.forEach(function (n) { mem.appendChild(el('p', { text: n.date + ': ' + n.text })); });
      }).catch(function () {});
    }

    var blocks = {};
    S.sections.forEach(function (sec) {
      var fs = el('fieldset', { cls: 'fn-section' }, [el('legend', { text: sec.id + '. ' + sec[L] })]);
      S.fields.filter(function (f) { return f.sec === sec.id; }).forEach(function (f) {
        var b = el('div', { cls: 'fn-q', 'data-field': f.id }, [el('label', { cls: 'fn-label', text: f.q + '  ' + f[L] + (f.required ? ' *' : '') })]);
        if (f.help) b.appendChild(el('p', { cls: 'fn-help', text: f.help[L] }));
        b.appendChild(input(f));

      });
      form.appendChild(fs);
    });
    var status = el('p', { cls: 'fn-status', role: 'status' });
    form.appendChild(el('button', { type: 'submit', cls: 'fn-submit', text: S.ui.submit[L] }));
    form.appendChild(status);
    root.appendChild(form);
    refreshVisibility();

    function input(f) {
      var name = 'fn_' + f.id, wrap;
      if (f.type === 'single' || f.type === 'multi') {
        wrap = el('div', { cls: 'fn-options' });
        f.options.forEach(function (op) {
          var id = name + '_' + op.v;
          var i = el('input', { type: f.type === 'single' ? 'radio' : 'checkbox', name: name, id: id, value: op.v });
          if (f.type === 'single' ? val(f) === op.v : (val(f) || []).indexOf(op.v) >= 0) i.checked = true;
          i.addEventListener('change', function () {
            if (f.type === 'single') note[f.id] = op.v;
            else {
              var cur = (note[f.id] || []).filter(function (x) { return x !== op.v; });
              if (i.checked) {
                if (op.v === f.exclusive) cur = [];
                else cur = cur.filter(function (x) { return x !== f.exclusive; });
                cur.push(op.v);
              }
              note[f.id] = cur;
              Array.prototype.forEach.call(wrap.querySelectorAll('input'), function (x) { x.checked = cur.indexOf(x.value) >= 0; });
            }
            save(); refreshVisibility();
          });
          wrap.appendChild(el('label', { cls: 'fn-opt', 'for': id }, [i, el('span', { text: op[L] })]));
        });
        return wrap;
      }
      if (f.type === 'scale') {
        wrap = el('div', { cls: 'fn-scale' });
        wrap.appendChild(el('span', { cls: 'fn-anchor', text: f.anchors[L][0] }));
        for (var n = f.scale.min; n <= f.scale.max; n++) (function (n) {
          var id = name + '_' + n, i = el('input', { type: 'radio', name: name, id: id, value: String(n) });
          if (val(f) === n) i.checked = true;
          i.addEventListener('change', function () { note[f.id] = n; save(); });
          wrap.appendChild(el('label', { cls: 'fn-opt', 'for': id }, [i, el('span', { text: String(n) })]));
        })(n);
        wrap.appendChild(el('span', { cls: 'fn-anchor', text: f.anchors[L][1] }));
        return wrap;
      }
      var attrs = { name: name, id: name };
      if (f.type === 'int') { attrs.type = 'number'; attrs.inputmode = 'numeric'; attrs.min = f.min; attrs.max = f.max; }
      if (f.type === 'time') attrs.type = 'time';
      if (f.type === 'itemlist') { attrs.type = 'text'; attrs.inputmode = 'numeric'; attrs.placeholder = '3, 7, 12'; }
      var x = el(f.type === 'text' ? 'textarea' : 'input', Object.assign(attrs, f.type === 'text' ? { maxlength: S.textMax, rows: 3 } : {}));
      var v = val(f);

      x.addEventListener('input', function () {
        var s = x.value.trim();

        else if (f.type === 'itemlist') note[f.id] = s === '' ? undefined : s.split(/[,\s]+/).filter(Boolean).map(Number);
        else note[f.id] = s === '' ? undefined : (f.type === 'text' ? x.value : s);
        save();
      });
      return x;
    }

    function refreshVisibility() {
      S.fields.forEach(function (f) {
        if (!f.showIf) return;

      });
    }

      ev.preventDefault();
      var clean = {};

          var b = blocks[e.field]; if (!b) return;
          b.classList.add('fn-bad'); b.querySelector('.fn-err').textContent = e.code.replace(/_/g, ' ');
        });

      form.querySelector('.fn-submit').disabled = true;
      if (opts.onDone) opts.onDone();
    });
  }
  return { mount: mount };
})();

/**
 * School coverage list: Prajakta's screen (plain JS). Needs cov_core.js for COV_CONFIG labels only.

      low_confidence: { en: 'Low confidence (2 sessions held)', hi: 'कम भरोसा (2 सत्र हो चुके)', mr: 'कमी विश्वास (2 सत्र झाले)' },
      pending: { en: 'No forms scanned yet', hi: 'अभी कोई फ़ॉर्म स्कैन नहीं', mr: 'अजून फॉर्म स्कॅन नाहीत' },

      parents: { en: 'Parents', hi: 'अभिभावक', mr: 'पालक' }, fathers: { en: 'Fathers', hi: 'पिता', mr: 'वडील' },
      teachers: { en: 'Teachers and staff', hi: 'शिक्षक और स्टाफ', mr: 'शिक्षक व कर्मचारी' }, grades: { en: 'Grades', hi: 'कक्षाएँ', mr: 'इयत्ता' }

    near: { en: 'Score near the band line', hi: 'स्कोर बैंड रेखा के पास', mr: 'गुण बँड रेषेजवळ' },

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  function card(c, L) {

    head.appendChild(el('strong', null, c.institute_code));

    var grid = el('div', 'cov-grid');

      cell.appendChild(el('span', 'cov-lbl', T.items[k][L]));
      grid.appendChild(cell);
    });
    box.appendChild(grid);
    if (c.score === '' || c.score === null) {

  }

    return opts.load().then(function (r) {
      (r.schools || []).forEach(function (c) { list.appendChild(card(c, L)); });
    });
  }
  return { mount: mount };
})();

/* ---------- network + offline queue ---------- */
async function api(op,extra){
  if(!cfg.url) throw new Error("No link");
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),45000);
  try{
    const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({op,who:cfg.who,pass:cfg.pass},extra||{})),signal:ctl.signal,redirect:"follow"});
    const j=await r.json();
    if(!j.ok&&/passcode/i.test(j.error||"")&&op!=="status"&&op!=="claim") signOut(true);
    return j;
  } finally{clearTimeout(tm)}
}
function applyLocal(op){
  if(!data) return;
  if(op.op==="f_log"){const i=data.sessions.findIndex(x=>x.id===op.item.id);const s=schoolBy(op.item.school)||{};const x=Object.assign({school:s.no,loggedBy:cfg.who,loggedAt:new Date().toISOString(),_local:true},op.item);if(i>=0)data.sessions[i]=x;else data.sessions.unshift(x);
    if(op.item.scheduleId){const p=data.plan.find(p=>p.id===op.item.scheduleId);if(p&&op.item.status!=="postponed")p.status="done"}}
  if(op.op==="f_schedule"){const i=data.plan.findIndex(x=>x.id===op.item.id);const x=Object.assign({status:"planned",source:"app",_local:true},op.item);if(i>=0)data.plan[i]=x;else data.plan.push(x);data.plan.sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")))}
  if(op.op==="f_unschedule"){const p=data.plan.find(x=>x.id===op.id);if(p)p.status="cancelled"}
  if(op.op==="f_expense"){data.expenses=data.expenses||[];if(!data.expenses.some(x=>x._tmp===op.tmp))data.expenses.unshift(Object.assign({_tmp:op.tmp,status:"sending"},op.item,{school:op.item.school==="all"?"Pilot-wide":"School "+op.item.school}))}
  if(op.op==="f_review"){const f=(data.progress||{}).flagged||[];const i=f.findIndex(x=>x.id===op.id);if(i>=0)f.splice(i,1)}
  if(op.op==="f_assign"){const s=schoolBy(op.school);if(s)s.facilitators=op.facilitators}
  if(op.op==="f_decide"){data.approvals=(data.approvals||[]).filter(x=>x.id!==op.id)}
  if(op.op==="fn.save"){data.myNotes=data.myNotes||[];const k=fnKey(op.session);if(!data.myNotes.includes(k))data.myNotes.push(k)}
}
function enqueue(op){applyLocal(op);queue.push(op);persist();render();flush()}
async function flush(){
  if(busy||!queue.length||!cfg.pass) return;
  busy=true; setSync();
  try{
    while(queue.length){
      const op=queue[0];
      if(op.op==="f_expense"&&op.receiptData&&!op.item.receipt){
        const u=await api("f_receipt",{data:op.receiptData,mime:"image/jpeg",name:"receipt-"+op.item.date+"-"+cfg.who+".jpg"});
        if(!u.ok){toast(u.error||"Receipt upload failed");break}
        op.item.receipt=u.url; delete op.receiptData; persist();
      }
      const r=await api(op.op,op);
      if(!r.ok){
        toast(r.error==="already_submitted"?t("alreadySubmitted"):r.error==="invalid"?t("noteInvalid"):(r.error||"Could not save"));
        if(!/Too many|Service|timed out|Exception: /i.test(r.error||"")){queue.shift();persist();await load(true,true)}
        break;
      }
      if(op.op==="f_log"&&r.item){const i=data.sessions.findIndex(x=>x.id===r.item.id);if(i>=0)data.sessions[i]=r.item;if(r.item.flag==="far")toast(t("flagged")+" · "+r.item.distance+" m "+t("far"))}
      if(op.op==="f_schedule"&&r.warning)toast(t("lateBaseline"));
      if(op.op==="f_expense"&&r.item){const i=data.expenses.findIndex(x=>x._tmp===op.tmp);if(i>=0)data.expenses[i]=r.item}
      if(op.op==="f_referral"&&r.caseId){data.lastCase={caseId:r.caseId,status:r.status,tmp:op.tmp};showCase(r.caseId,r.status)}
      queue.shift(); persist(); online=true;
    }
  }catch(e){online=false}
  busy=false; setSync(); render();
}
async function load(quiet,noFlush){
  if(!cfg.pass) return;
  const b=$("#refresh"); b.classList.add("spin");
  try{
    if(!noFlush) await flush();
    const r=await api("f_boot");
    if(r.ok){
      const lc=data&&data.lastCase; data=r; if(lc) data.lastCase=lc;
      if(r.me&&r.me.lang&&!cfg.langSet){lang=r.me.lang;cfg.lang=lang;ls("by.cfg",cfg)}
      queue.forEach(applyLocal); online=true; lastSync=Date.now(); ls("by.last",lastSync); persist();
    } else if(!quiet) toast(r.error||"Could not load");
  }catch(e){online=false; if(!quiet) toast(t("offline"))}
  b.classList.remove("spin"); setSync(); render();
}
function setSync(){
  const d=$("#dot"), s=$("#syncText");
  if(busy){d.className="warn";s.textContent=t("saving");return}
  if(queue.length){d.className="warn";s.textContent=queue.length+" "+t("toSync");return}
  if(!online){d.className="warn";s.textContent=t("offline");return}
  d.className="ok"; s.textContent=t("upToDate");
}

  if(late.length) h+=sec(t("overdue"),late.map(p=>planRow(p,true)));
  if(tomorrow.length) h+=sec(t("tomorrow")+" · "+fmtD(tm),tomorrow.map(p=>planRow(p)));

let geoWatch=null, geo=null;
function startGeo(cb){
  geo=null; stopGeo();
  if(!navigator.geolocation){cb&&cb();return}
  geoWatch=navigator.geolocation.watchPosition(p=>{if(!geo||p.coords.accuracy<geo.accuracy)geo={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:Math.round(p.coords.accuracy)};cb&&cb()},()=>{geo=geo||{off:true};cb&&cb()},{enableHighAccuracy:true,timeout:30000,maximumAge:15000});
}
function stopGeo(){if(geoWatch!=null&&navigator.geolocation)navigator.geolocation.clearWatch(geoWatch);geoWatch=null}
function metres(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const x=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(x)))}

  const sh=openSheet(`<header><button id="lC">${t("cancel")}</button><h3>${t("logSession")}</h3><button class="strong" id="lS">${t("save")}</button></header><div class="body">
   <div class="fgroup"><div class="frow"><label>${t("school")}</label><select id="lSch"><option value="">${t("pick")}</option>${mine.map(x=>`<option value="${x.no}" ${s&&s.no===x.no?"selected":""}>${x.no} · ${esc(x.name)}</option>`).join("")}</select></div><div class="sep"></div>
    <div class="frow"><label>${t("code")}</label><input id="lCode" autocapitalize="characters" autocomplete="off" placeholder="INS-0000"></div><div class="hint" id="codeHint">${t("codeHint")}</div></div>
   <div class="geo" id="lGeo">${t("locating")}</div>
   <div class="fgroup"><div class="frow col"><label>${t("session")}</label>${pick("type",types().map(ty=>[ty.id,typeName(ty.id)]),f.type)}</div>
    <div id="secBox"></div><div class="sep"></div>
    <div class="frow"><label>${t("batch")}</label><input id="lBatch" value="${esc(f.batch)}" placeholder="5th A"></div><div class="sep"></div>
    <div class="frow"><label>${t("date")}</label><input type="date" id="lDate" value="${f.date}" max="${todayIso()}"></div><div class="sep"></div>
    <div class="frow"><label>${t("time")}</label><input type="time" id="lTime" value="${f.time}"></div></div>
   <div class="fgroup"><div class="frow col"><label>${t("status")}</label>${pick("status",[["done",t("done")],["partly",t("partly")],["postponed",t("postponed")],["cancelled",t("cancelled")]],f.status)}</div>
    <div id="reasonBox" hidden><div class="sep"></div><div class="frow"><label>${t("reason")}</label><input id="lReason"></div></div></div>
   <div class="fgroup" id="countBox"><div class="frow"><label>${t("girls")}</label><input id="lG" inputmode="numeric" placeholder="0"></div><div class="sep"></div><div class="frow"><label>${t("boys")}</label><input id="lB" inputmode="numeric" placeholder="0"></div><div class="sep"></div><div class="frow"><label>${t("planned")}</label><input id="lP" inputmode="numeric" placeholder="—"></div></div>
   <div class="fgroup" id="consBox" hidden><div class="frow"><label>${t("consentOut")}</label><input id="lCO" inputmode="numeric"></div><div class="sep"></div><div class="frow"><label>${t("consentIn")}</label><input id="lCI" inputmode="numeric"></div></div>
   <div class="fgroup"><div class="frow col"><label>${t("facilitators")}</label>${pick("facs",people,f.facilitators,true)}</div></div>
   <div class="fgroup"><textarea id="lNotes" rows="3" placeholder="${t("notes")}"></textarea></div>
   <div class="err" id="lErr"></div></div>`,"wide");
  wirePick(sh,()=>paint());
  const paintGeo=()=>{const g=$("#lGeo");if(!g)return;if(!geo){g.className="geo";g.textContent=t("locating");return}
    if(geo.off){g.className="geo bad";g.textContent=t("locOff");return}
    let d="";if(s&&s.lat!=null){const m=metres(geo.lat,geo.lng,s.lat,s.lng);d=" · "+m+" m"+(m>rules().farMetres?" "+t("far"):"");g.className="geo "+(m>rules().farMetres?"warn":"ok")}else g.className="geo ok";
    g.textContent=t("locOk")+" ("+t("accuracy")+" ±"+geo.accuracy+" m)"+d};
  const paint=()=>{
    const ty=pickVal(sh,"type"), st=pickVal(sh,"status");
    $("#reasonBox").hidden=!(st==="postponed"||st==="cancelled");
    $("#consBox").hidden=ty!=="consent";
    $("#countBox").hidden=st==="postponed"||st==="cancelled";
    const secs=s&&s.sections||[];
    $("#secBox").innerHTML=secs.length>1?`<div class="sep"></div><div class="frow col"><label>${t("section")}</label>${pick("section",secs.map((x,i)=>[i,x.label+" · "+(x.girls+x.boys)]),f.section)}</div>`:"";
    wirePick($("#secBox"));
    const c=$("#lCode").value.trim(); const h=$("#codeHint");
    const norm=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^INS/,"");
    if(c&&s){const ok=norm(c)===norm(s.code);h.className="hint "+(ok?"ok":"bad");h.textContent=ok?"✓ "+s.name:t("wrongCode")}else{h.className="hint";h.textContent=t("codeHint")}
    paintGeo();
  };
  $("#lSch").onchange=()=>{s=schoolBy($("#lSch").value);paint()};
  $("#lCode").oninput=paint;
  paint(); startGeo(paintGeo);
  $("#lC").onclick=closeSheet;
  $("#lS").onclick=()=>{
    const E=$("#lErr"); E.textContent="";
    if(!s){E.textContent=t("pick")+" "+t("school");return}
    const code=$("#lCode").value.trim(); if(!code){E.textContent=t("needCode");return}
    const norm=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^INS/,"");
    if(norm(code)!==norm(s.code)){E.textContent=t("wrongCode");return}
    const ty=pickVal(sh,"type"), st=pickVal(sh,"status");
    if(!ty){E.textContent=t("pick")+" "+t("session");return}
    const reason=$("#lReason").value.trim(); if((st==="postponed"||st==="cancelled")&&!reason){E.textContent=t("reason")+"?";return}
    const g=+$("#lG").value||0,b=+$("#lB").value||0;
    if((st==="done"||st==="partly")&&!g&&!b&&ty!=="onboard"&&ty!=="consent"){E.textContent=t("headcount")+"?";return}
    const item={id:f.id,school:s.no,code,type:ty,section:+pickVal(sh,"section")||0,batch:$("#lBatch").value.trim(),date:$("#lDate").value||todayIso(),time:$("#lTime").value,status:st,reason,
      girls:g,boys:b,planned:+$("#lP").value||"",consentOut:+$("#lCO").value||"",consentIn:+$("#lCI").value||"",facilitators:pickVal(sh,"facs"),notes:$("#lNotes").value.trim(),scheduleId:f.scheduleId,
      lat:geo&&!geo.off?geo.lat:"",lng:geo&&!geo.off?geo.lng:"",accuracy:geo&&!geo.off?geo.accuracy:""};
    if(item.facilitators.length===0) item.facilitators=[cfg.who];
    stopGeo(); closeSheet(); enqueue({op:"f_log",item}); toast(navigator.onLine?t("saved"):t("queued"));
  };
}

/* ---------- Book a session ---------- */
function openBook(pre){
  pre=pre||{}; let s=schoolBy(pre.school);
  const R=rules();
  const sh=openSheet(`<header><button id="bC">${t("cancel")}</button><h3>${t("bookSession")}</h3><button class="strong" id="bS">${t("save")}</button></header><div class="body">
   <div class="fgroup"><div class="frow"><label>${t("school")}</label><select id="bSch"><option value="">${t("pick")}</option>${data.schools.map(x=>`<option value="${x.no}" ${s&&s.no===x.no?"selected":""}>${x.no} · ${esc(x.name)}</option>`).join("")}</select></div></div>
   <div class="fgroup"><div class="frow col"><label>${t("session")}</label>${pick("type",types().map(ty=>[ty.id,typeName(ty.id)]),pre.type||"")}</div><div id="bSec"></div><div class="sep"></div>
    <div class="frow"><label>${t("date")}</label><input type="date" id="bDate" min="${todayIso()}" max="${R.pilotEnd}"></div><div class="hint" id="bHint"></div><div class="sep"></div>
    <div class="frow"><label>${t("time")}</label><input type="time" id="bTime" value="10:30"></div><div class="sep"></div>
    <div class="frow"><label>${t("batch")}</label><input id="bBatch" placeholder="5th A"></div></div>
   <div class="fgroup"><textarea id="bNote" rows="2" placeholder="${t("notes")}"></textarea></div><div class="err" id="bErr"></div></div>`);
  wirePick(sh,()=>check());
  const check=()=>{
    const ty=pickVal(sh,"type"), d=$("#bDate").value, H=$("#bHint"), E=$("#bErr"); E.textContent=""; H.className="hint"; H.textContent="";
    const secs=s&&s.sections||[]; if(!$("#bSec").dataset.s||$("#bSec").dataset.s!=String(s&&s.no)){$("#bSec").dataset.s=String(s&&s.no);$("#bSec").innerHTML=secs.length>1?`<div class="sep"></div><div class="frow col"><label>${t("section")}</label>${pick("section",[["",t("all")]].concat(secs.map((x,i)=>[i,x.label])),"")}</div>`:"";wirePick($("#bSec"))}
    if(ty==="review"&&s){const tr=s.tracker||{};if(!tr.baselineDone){H.className="hint bad";H.textContent=t("noBaseline");return false}
      const e=dPlus(tr.baselineDone,R.endlineDays); if(!d){$("#bDate").min=e;$("#bDate").max=R.lastEndline;H.textContent=t("earliestEnd")+": "+fmtD(e);return true}
      if(d<e){H.className="hint bad";H.textContent=t("earliestEnd")+": "+fmtD(e);return false}
      if(d>R.lastEndline){H.className="hint bad";H.textContent=t("afterLast");return false}}
    else {$("#bDate").min=todayIso();$("#bDate").max=R.pilotEnd}
    if(d){const h=holidayOf(d);if(h){H.className="hint bad";H.textContent=t("closed")+" · "+h;return false}
      if(ty==="baseline"&&d>R.lastBaseline){H.className="hint warn";H.textContent=t("lateBaseline")} else H.textContent=fmtD(d)}
    return true;
  };
  $("#bSch").onchange=()=>{s=schoolBy($("#bSch").value);check()}; $("#bDate").onchange=check; check();
  $("#bC").onclick=closeSheet;
  $("#bS").onclick=()=>{
    const E=$("#bErr"), ty=pickVal(sh,"type"), d=$("#bDate").value;
    if(!s){E.textContent=t("pick")+" "+t("school");return} if(!ty){E.textContent=t("pick")+" "+t("session");return} if(!d){E.textContent=t("date")+"?";return}
    if(!check()){E.textContent=$("#bHint").textContent;return}
    const sec=pickVal(sh,"section");
    enqueue({op:"f_schedule",item:{id:rid("P"),school:s.no,type:ty,section:sec===""?"":+sec,date:d,time:$("#bTime").value,batch:$("#bBatch").value.trim(),note:$("#bNote").value.trim(),assignee:s.facilitators||[]}});
    closeSheet(); toast(t("saved"));
  };
}

/* ---------- Expense ---------- */
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.78))};img.onerror=rej;img.src=u})}
function openExpense(){
  let photo="";
  const acts=(data.activities||[]).map(a=>a[1]);
  const sh=openSheet(`<header><button id="eC">${t("cancel")}</button><h3>${t("newExpense")}</h3><button class="strong" id="eS">${t("save")}</button></header><div class="body">
   <div class="amt"><span>₹</span><input id="eAmt" inputmode="decimal" placeholder="0" autocomplete="off"></div>
   <div class="fgroup"><div class="frow col"><label>${t("category")}</label>${pick("cat",CATS.map(c=>[c[0],lang==="hi"?c[1]:c[0]]),"Travel")}</div><div class="sep"></div>
    <div class="frow"><label>${t("date")}</label><input type="date" id="eDate" value="${todayIso()}" max="${todayIso()}"></div><div class="sep"></div>
    <div class="frow"><label>${t("school")}</label><select id="eSch"><option value="all">${t("pilotWide")}</option>${data.schools.map(x=>`<option value="${x.no}">${x.no} · ${esc(x.name)}</option>`).join("")}</select></div><div class="sep"></div>
    <div class="frow"><label>${t("activity")}</label><select id="eAct"><option value="">—</option>${acts.map(a=>`<option>${esc(a)}</option>`).join("")}</select></div><div class="sep"></div>
    <div class="frow"><label>${t("notes")}</label><input id="eNote" placeholder="${lang==="hi"?"जैसे स्कूल 3 तक ऑटो":"e.g. Auto to School 3"}"></div></div>
   <div class="fgroup"><label class="receipt"><span class="thumb" id="eThumb">📷</span><div><b id="eRT">${t("receipt")}</b><small>${t("receiptNeed")}</small></div><input type="file" id="eFile" accept="image/*" capture="environment" hidden></label></div>
   <div class="err" id="eErr"></div></div>`);
  wirePick(sh);
  $("#eFile").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{photo=await shrink(f);$("#eThumb").innerHTML=`<img src="${photo}" alt="">`;$("#eRT").textContent=t("attached")}catch(e){toast("Photo?")}};
  $("#eC").onclick=closeSheet;
  $("#eS").onclick=()=>{const E=$("#eErr");const amt=Math.round((+String($("#eAmt").value).replace(/,/g,"")||0)*100)/100;
    if(!(amt>0)){E.textContent=t("amount")+"?";return}
    if(amt>rules().autoLimit&&!photo){E.textContent=t("receiptNeed");return}
    const item={amount:amt,category:pickVal(sh,"cat"),date:$("#eDate").value||todayIso(),school:$("#eSch").value,activity:$("#eAct").value,note:$("#eNote").value.trim()};
    const op={op:"f_expense",item,tmp:rid("T")}; if(photo) op.receiptData=photo;
    closeSheet(); enqueue(op); toast(amt>rules().autoLimit?t("pending"):t("saved"));};
}

/* ---------- Referral (anonymous) ---------- */
function openReferral(){
  const sh=openSheet(`<header><button id="rC">${t("cancel")}</button><h3>${t("newReferral")}</h3><button class="strong" id="rS">${t("save")}</button></header><div class="body">
   <div class="note">${esc(t("refNote"))}</div>
   <div class="fgroup"><div class="frow col"><label>${t("refType")}</label>${pick("type",[["Police",lang==="hi"?"पुलिस":"Police"],["Hospital",lang==="hi"?"अस्पताल":"Hospital"],["Therapist",lang==="hi"?"थेरेपिस्ट":"Therapist"]],"")}</div><div class="sep"></div>
    <div class="frow"><label>${t("age")}</label><input id="rAge" inputmode="numeric"></div><div class="sep"></div>
    <div class="frow col"><label>${t("gender")}</label>${pick("gender",[["Girl",t("girl")],["Boy",t("boy")],["Other",t("other")],["Not said",t("notSaid")]],"")}</div><div class="sep"></div>
    <div class="frow"><label>${t("date")}</label><input type="date" id="rDate" value="${todayIso()}" max="${todayIso()}"></div><div class="sep"></div>
    <div class="frow"><label>${t("time")}</label><input type="time" id="rTime" value="${nowHM()}"></div></div>
   <div class="fgroup"><div class="frow col"><label>${t("pocso")}</label>${pick("pocso",[["y",t("yes")],["n",t("no")]],"n")}</div>
    <div id="rRep" hidden><div class="sep"></div><div class="frow col"><label>${t("reported")}</label>${pick("rep",[["y",t("yes")],["n",t("no")]],"n")}</div>
     <div id="rRepD" hidden><div class="sep"></div><div class="frow"><label>${t("reportDate")}</label><input type="date" id="rRD" max="${todayIso()}"></div><div class="sep"></div><div class="frow"><label>${t("time")}</label><input type="time" id="rRT"></div></div></div></div>
   <div class="err" id="rErr"></div></div>`);
  wirePick(sh,()=>{$("#rRep").hidden=pickVal(sh,"pocso")!=="y";$("#rRepD").hidden=pickVal(sh,"rep")!=="y"});
  $("#rC").onclick=closeSheet;
  $("#rS").onclick=async()=>{const E=$("#rErr");const type=pickVal(sh,"type"),g=pickVal(sh,"gender"),age=$("#rAge").value;
    if(!type){E.textContent=t("refType")+"?";return} if(age===""){E.textContent=t("age")+"?";return} if(!g){E.textContent=t("gender")+"?";return}
    const pocso=pickVal(sh,"pocso")==="y", rep=pocso&&pickVal(sh,"rep")==="y";
    if(rep&&!$("#rRD").value){E.textContent=t("reportDate")+"?";return}
    const item={type,age:+age,gender:g,date:$("#rDate").value,time:$("#rTime").value,pocso,reported:rep,reportDate:rep?$("#rRD").value:"",reportTime:rep?$("#rRT").value:""};
    $("#rS").disabled=true;
    try{const r=await api("f_referral",{item});if(!r.ok){E.textContent=r.error;$("#rS").disabled=false;return}closeSheet();showCase(r.caseId,r.status);load(true)}
    catch(e){closeSheet();enqueue({op:"f_referral",item,tmp:rid("T")});toast(lang==="hi"?"नेटवर्क आने पर केस ID दिखेगी":"The Case ID will appear once this syncs")}};
}
function showCase(id,status){openSheet(`<header><span style="min-width:64px"></span><h3>${t("caseId")}</h3><button class="strong" id="cOk">${t("close")}</button></header><div class="body"><div class="casebig num">${esc(id)}</div><p class="note">${esc(status==="pocso-pending"?(lang==="hi"?"POCSO: अनिवार्य रिपोर्ट अभी बाकी है। प्रजक्ता सर्वोत्तम को सूचना भेज दी गई है।":"POCSO: the mandatory report is still pending. Prajakta Sarwottam has been told."):t("refNote"))}</p></div>`);$("#cOk").onclick=()=>{closeSheet();if(data)delete data.lastCase;persist();render()}}
function openCheckpoint(id){
  openSheet(`<header><button id="kC">${t("cancel")}</button><h3>${esc(id)}</h3><button class="strong" id="kS">${t("save")}</button></header><div class="body"><div class="fgroup"><div class="frow"><label>${t("reportDate")}</label><input type="date" id="kD" max="${todayIso()}"></div><div class="sep"></div><div class="frow"><label>${t("time")}</label><input type="time" id="kT"></div></div><div class="err" id="kE"></div></div>`);
  $("#kC").onclick=closeSheet;
  $("#kS").onclick=async()=>{const d=$("#kD").value;if(!d){$("#kE").textContent=t("reportDate")+"?";return}const r=await api("f_checkpoint",{caseId:id,item:{reportDate:d,reportTime:$("#kT").value}}).catch(()=>({ok:false,error:t("offline")}));if(!r.ok){$("#kE").textContent=r.error;return}closeSheet();toast(t("saved"));load(true)};
}

/* ---------- sign in ---------- */
function signOut(quiet){cfg={url:cfg.url,base:cfg.base,who:cfg.who,lang};ls("by.cfg",cfg);data=null;queue=[];persist();ls("by.data",null);if(!quiet)toast(t("signOut"));showSetup()}
function paintSetup(){
  $("#sIntro").textContent=t("whoUses"); $("#sUrl").textContent=t("pasteLink"); $("#sClaim").textContent=t("setupCode");
  $("#pass").placeholder=t("passPh"); $("#newPass").placeholder=t("newPh"); $("#newPass2").placeholder=t("againPh"); $("#goBtn").textContent=t("go"); $("#ver").textContent=VERSION;
  $("#whoSeg").innerHTML=PEOPLE.map(([id,n,r])=>`<button type="button" data-who="${id}" aria-pressed="${cfg.who===id}"><i class="${r}">${n[0]}</i><span>${esc(n)}<small>${esc(t(r))}</small></span></button>`).join("");
  $$("#whoSeg button").forEach(b=>b.onclick=()=>pickWho(b.dataset.who));
  $$(".slang button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.l===lang);b.onclick=()=>setLang(b.dataset.l)});
}
let pickSeq=0;
function showSetup(){$("#setup").hidden=false;$("#urlBox").hidden=!!cfg.url;$("#apiUrl").value=cfg.url||"";$("#setupErr").textContent="";$("#signinBox").hidden=true;$("#claimBox").hidden=true;paintSetup();if(cfg.who&&cfg.url)pickWho(cfg.who)}
async function pickWho(w){
  cfg.who=w; ls("by.cfg",{url:cfg.url,base:cfg.base,who:w,lang:cfg.lang}); $$("#whoSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.who===w));
  const u=$("#apiUrl").value.trim(); if(u) cfg.url=u;
  if(!cfg.url){$("#urlBox").hidden=false;$("#setupErr").textContent=t("pasteLink");return}
  const my=++pickSeq; $("#setupWait").hidden=false; $("#signinBox").hidden=true; $("#claimBox").hidden=true; $("#setupErr").textContent="";
  try{const r=await api("status"); if(my!==pickSeq)return; $("#setupWait").hidden=true; if(!r.ok)throw new Error(r.error);
    (r.claimed?$("#signinBox"):$("#claimBox")).hidden=false; setTimeout(()=>(r.claimed?$("#pass"):$("#invite")).focus(),50);
  }catch(e){if(my!==pickSeq)return;$("#setupWait").hidden=true;$("#urlBox").hidden=false;$("#setupErr").textContent=t("cantReach")}
}
$("#apiUrl").addEventListener("change",()=>{cfg.url=$("#apiUrl").value.trim();ls("by.cfg",cfg);if(cfg.who)pickWho(cfg.who)});
$("#setupForm").onsubmit=async ev=>{
  ev.preventDefault(); const E=$("#setupErr"); E.textContent="";
  if(!cfg.who){E.textContent=t("tapName");return}
  try{
    if(!$("#claimBox").hidden){const a=$("#newPass").value,b=$("#newPass2").value;
      if(a.length<6){E.textContent=t("short");return} if(a!==b){E.textContent=t("mismatch");return}
      const r=await api("claim",{invite:$("#invite").value,newPass:a}); if(!r.ok){E.textContent=r.error;return} cfg.pass=a;
    } else if(!$("#signinBox").hidden){cfg.pass=$("#pass").value;const r=await api("f_boot");if(!r.ok){cfg.pass="";E.textContent=r.error;return}data=r;persist()}
    else return;
    ls("by.cfg",cfg); $("#setup").hidden=true; ["#pass","#newPass","#newPass2","#invite"].forEach(s=>$(s).value=""); load();
  }catch(e){E.textContent=t("cantReach")}
};

/* ---------- boot ---------- */
$("#fab").onclick=()=>openLog(openSchool?{school:openSchool}:{});
$("#refresh").onclick=()=>load();
window.addEventListener("scroll",()=>$("#nav").classList.toggle("scrolled",window.scrollY>30),{passive:true});
window.addEventListener("online",()=>load(true));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&cfg.pass)load(true)});
setInterval(()=>{if(cfg.pass&&!document.hidden&&$("#setup").hidden)load(true)},120000);
render();
if(!cfg.pass||!cfg.url) showSetup(); else load();
if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
